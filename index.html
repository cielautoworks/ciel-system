<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ciel System | シエルオートワークス</title>
<style>
:root{
  --sky:#4AABCF; --pink:#D97A9A;
  --bg:#f5f6f4; --card:#ffffff; --border:#e2e2de;
  --text:#232320; --text-sub:#6b6b65; --text-muted:#9a9a92;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);}
header{background:linear-gradient(90deg,var(--sky),#3d8fae);color:#fff;padding:28px 28px 24px;}
header h1{margin:0;font-size:22px;font-weight:600;}
header p{margin:6px 0 0;font-size:13px;opacity:.9;}
.wrap{padding:24px 28px 60px;max-width:1000px;margin:0 auto;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:20px;}
.tool{display:block;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 22px 20px;text-decoration:none;color:var(--text);transition:box-shadow .15s,transform .15s;}
.tool:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);transform:translateY(-2px);}
.tool .icon{font-size:26px;margin-bottom:10px;display:block;}
.tool h2{margin:0 0 6px;font-size:16px;font-weight:600;}
.tool p{margin:0;font-size:12.5px;color:var(--text-sub);line-height:1.6;}
.tool .tag{display:inline-block;margin-top:12px;font-size:11px;padding:3px 10px;border-radius:20px;background:#e9f4ea;color:#2c6b34;}
.tool.soon{opacity:.55;cursor:default;pointer-events:none;}
.tool.soon .tag{background:#f1efe8;color:#6b6b65;}
.section-label{font-size:12px;color:var(--text-muted);margin:28px 0 4px;letter-spacing:.02em;}
footer{font-size:11.5px;color:var(--text-muted);margin-top:32px;}
</style>
</head>
<body>
<header>
<h1>Ciel System</h1>
<p>シエルオートワークス 業務ツール一覧</p>
</header>
<div class="wrap">

<div class="section-label">稼働中のツール</div>
<div class="grid">
  <a class="tool" href="https://cielautoworks.github.io/car-app/" target="_blank" rel="noopener">
    <span class="icon">🚗</span>
    <h2>在庫管理(car-app)</h2>
    <p>車両在庫の登録・整備状況・納車管理を行うメインの在庫管理システム。</p>
    <span class="tag">稼働中</span>
  </a>
  <a class="tool" href="./ads.html">
    <span class="icon">📊</span>
    <h2>広告掲載状況ダッシュボード</h2>
    <p>カーセンサー・グーネット・QuickNetwork・オートサーバーの4サイトを車台番号で突合し、掲載漏れ・価格ずれ・走行距離ずれ・車検ずれを一覧表示。</p>
    <span class="tag">稼働中</span>
  </a>
</div>

<div class="section-label">準備中</div>
<div class="grid">
  <a class="tool soon" href="#">
    <span class="icon">📈</span>
    <h2>出品履歴チェック</h2>
    <p>準備中です。</p>
    <span class="tag">準備中</span>
  </a>
  <a class="tool soon" href="#">
    <span class="icon">💰</span>
    <h2>プライシングツール</h2>
    <p>準備中です。</p>
    <span class="tag">準備中</span>
  </a>
</div>

<footer>このページはリンク集です。各ツールは個別に動作しており、データは連携していません。</footer>
</div>
</body>
</html>
